<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-label="A chat where the AI checks a slow website on a server and asks before restarting anything">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0" r="0.9">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
      .msg { font-size: 22px; fill: #E2E8F0; }
      .dim { font-size: 20px; fill: #94A3B8; }
      .chip { font-size: 17px; }
    </style>
  </defs>
  <rect width="1400" height="940" rx="22" fill="#0D1526"/>
  <rect width="1400" height="940" rx="22" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1399" height="939" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <path d="M0 22 A22 22 0 0 1 22 0 H1378 A22 22 0 0 1 1400 22 V60 H0 Z" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="34" cy="30" r="8" fill="#F87171"/>
  <circle cx="60" cy="30" r="8" fill="#FBBF24"/>
  <circle cx="86" cy="30" r="8" fill="#34D399"/>
  <text x="700" y="37" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#94A3B8">Your AI app</text>

  <g class="sans">
    <!-- User -->
    <rect x="610" y="96" width="734" height="64" rx="22" fill="url(#brand)"/>
    <text x="638" y="136" font-size="22" font-weight="600" fill="#FFFFFF">My website feels slow today. Can you check "web"?</text>

    <!-- Assistant -->
    <circle cx="80" cy="216" r="24" fill="url(#brand)"/>
    <path d="M70 207 L79 216 L70 225" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="84" y="222" width="10" height="4" rx="2" fill="#FFFFFF"/>
    <text x="124" y="224" class="msg">Sure. I'll take a look without changing anything.</text>

    <g class="mono chip">
      <rect x="124" y="250" width="338" height="40" rx="10" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.30"/>
      <text x="142" y="276" fill="#67E8F9">ssh_exec  uptime</text>
      <rect x="476" y="250" width="338" height="40" rx="10" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.30"/>
      <text x="494" y="276" fill="#67E8F9">ssh_exec  top -b -n 1</text>
      <rect x="828" y="250" width="420" height="40" rx="10" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-opacity="0.35"/>
      <text x="846" y="276" fill="#D8B4FE">sftp_read_file  nginx/error.log</text>
    </g>

    <rect x="124" y="314" width="1220" height="374" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="156" y="362" font-size="24" font-weight="700" fill="#F8FAFC">Here's what I found on web:</text>

    <circle cx="166" cy="410" r="7" fill="#F87171"/>
    <text x="190" y="418" class="msg"><tspan font-weight="700">The processor is at 94%.</tspan> Six PHP workers have been stuck for over an hour.</text>
    <circle cx="166" cy="462" r="7" fill="#FBBF24"/>
    <text x="190" y="470" class="msg"><tspan font-weight="700">1,284 database timeouts</tspan> in the last hour, all from the same page:</text>
    <text x="190" y="502" class="mono" font-size="19" fill="#CBD5E1">/checkout/summary</text>
    <circle cx="166" cy="546" r="7" fill="#34D399"/>
    <text x="190" y="554" class="msg"><tspan font-weight="700">Memory and disk are fine</tspan> (62% and 41% used).</text>

    <line x1="156" y1="592" x2="1312" y2="592" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="156" y="634" class="msg">Restarting PHP should fix it for now. <tspan font-weight="700" fill="#FFFFFF">Want me to do that?</tspan></text>
    <text x="156" y="666" class="dim">I'll wait for your OK before changing anything.</text>

    <!-- Reply -->
    <rect x="1054" y="716" width="290" height="64" rx="22" fill="url(#brand)"/>
    <text x="1082" y="756" font-size="22" font-weight="600" fill="#FFFFFF">Yes, go ahead.</text>

    <!-- Composer -->
    <rect x="56" y="836" width="1288" height="64" rx="32" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="92" y="876" class="dim">Ask about any of your servers...</text>
    <circle cx="1306" cy="868" r="22" fill="url(#brand)"/>
    <path d="M1296 868 H1314 M1307 860 L1315 868 L1307 876" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
