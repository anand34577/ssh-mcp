  <rect x="96" y="928" width="888" height="72" rx="36" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="540" y="974" text-anchor="middle" class="sans" font-size="28" font-weight="600" fill="#E6EDF7">Free and open source · github.com/anand34577/ssh-mcp</text>
