name: Release Go binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: linux
            goarch: amd64
            extension: ''
          - goos: linux
            goarch: arm64
            extension: ''
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/ssh-mcp-server-${GOOS}-${GOARCH}${{ matrix.extension }}" \
            ./cmd/ssh-mcp-server
          sha256sum "dist/ssh-mcp-server-${GOOS}-${GOARCH}${{ matrix.extension }}" \
            > "dist/ssh-mcp-server-${GOOS}-${GOARCH}${{ matrix.extension }}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            go/dist/ssh-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
            go/dist/ssh-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ssh-mcp-server-*
          merge-multiple: true
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SSH MCP Server ${GITHUB_REF_NAME}" \
            --generate-notes
