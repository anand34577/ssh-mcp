name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: go
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test -race -count=1 ./...
          else
            go test -count=1 ./...
          fi

  go-build:
    name: Go ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, extension: .exe }
          - { goos: windows, goarch: arm64, extension: .exe }
          - { goos: linux, goarch: amd64, extension: '' }
          - { goos: linux, goarch: arm64, extension: '' }
          - { goos: darwin, goarch: amd64, extension: '' }
          - { goos: darwin, goarch: arm64, extension: '' }
    defaults:
      run:
        working-directory: go
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build binary
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" \
            -o "dist/ssh-mcp-server-${GOOS}-${GOARCH}${{ matrix.extension }}" \
            ./cmd/ssh-mcp-server

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ssh-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go/dist/ssh-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
          if-no-files-found: error

  java-test:
    name: Java ${{ matrix.java }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '21']
    defaults:
      run:
        working-directory: java
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run Maven verification and package checks
        run: mvn -B -ntp verify

  installers:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check install.sh
        run: |
          sh -n install.sh
          shellcheck install.sh assets/tools/render.sh

      - name: Check install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
